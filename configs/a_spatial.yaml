# Spatial DTI-INR (Model A) — first real-data experiment
# WLS-DTI is used as a reference, not as training supervision.

dataset:
  name: HCP-YA
  hcp_root: "E:/BaiduNetdiskDownload/HCP/3T 146"
  subjects:
    - "131217"

model:
  name: spatial_dti_inr
  hidden_dim: 128
  num_layers: 4
  num_frequencies: 8
  activation: gelu

training:
  epochs: 800
  batch_size: 8192
  learning_rate: 1.0e-3
  seed: 42
  b_scale: 1000.0   # train with b'=b/1000; D_mm2s = D_network / b_scale
  # note: loader collapses multiple b0s into one mean b0 to avoid b0-dominated MSE

sampling:
  shells: [1000.0]  # b0 + b≈1000 only
  direction_scheme: full

evaluation:
  reference: WLS-DTI
  reference_note: "WLS-DTI is used as a reference, not as training supervision."
