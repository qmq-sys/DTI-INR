# Pilot: Full-data Reference Sparse DTI Estimation (1 subject)

dataset:
  name: HCP-YA
  hcp_root: "E:/BaiduNetdiskDownload/HCP/3T 146"
  subjects:
    - "109830"

reference:
  root: "reference"          # DTI-INR/reference/<subject_id>/
  shells: [1000.0]
  keep_all_b0: true          # Full b0 + Full b1000 for DIPY WLS

sparse:
  n_directions: [6, 15, 30, 45]
  seed: 42
  seeds: [1, 2, 3, 4, 5]
  # protocol = 1 b0 + n_directions (b0 not counted)

# Experiment 2 (enable via --exp2 or configs/sparse_vs_full_ref_exp2.yaml)
# experiment2:
#   enabled: true
#   subject: "109830"
#   n_directions: [6, 15, 30, 45]
#   seeds: [1, 2, 3, 4, 5]
#   save_comparison_figures: false

model:
  name: spatial_dti_param_field
  hidden_dim: 128
  num_layers: 4
  use_hashgrid: true
  hashgrid_concat_xyz: true
  use_q_feature: false
  q_embed_dim: 32
  hash_encoding:
    n_levels: 16
    n_features_per_level: 2
    log2_hashmap_size: 19
    base_resolution: 16
    max_resolution: 1024

training:
  epochs: 200
  batch_size: 4096
  learning_rate: 1.0e-3
  seed: 42
  b_scale: 1000.0
  early_stop: true
  early_stop_patience: 25
  early_stop_min_delta: 1.0e-6
  val_fraction: 0.1
